<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Anki Strahl</title>
  <!-- Die Sonne aus dem Schriftzug, auf das Nötigste reduziert.

       Bei 16 Pixeln überlebt kein Detail. Deshalb nur zwei Formen: eine volle
       Scheibe und acht kurze, dicke Strahlen. Dünnere Strahlen verschwinden
       beim Verkleinern zu grauem Nebel. Der dunkle Kreis darunter ist nicht
       Dekoration, sondern Zweck: ohne ihn wäre das goldene Motiv auf einem
       hellen Browser-Tab kaum zu sehen.

       Farben stehen als Hex hier, nicht als oklch wie im Stylesheet. Favicons
       werden teils außerhalb der Browser-Engine gezeichnet, und dort ist oklch
       nicht verlässlich. #473660 entspricht dem Farbton dusk, #E8B84B einer
       aufgehellten Variante von sun-deep.

       Hinweis für später: In diesem Kommentar darf kein doppelter Bindestrich
       vorkommen. SVG wird als XML gelesen, und XML bricht daran ab. Genau das
       ist hier schon einmal passiert, weil die Farbtokens mit ihren zwei
       führenden Bindestrichen notiert waren. Das Ergebnis war eine Datei, die
       der Server ausliefert, die aber kein Browser anzeigt. -->
  <circle cx="16" cy="16" r="16" fill="#473660"/>
  <circle cx="16" cy="16" r="5" fill="#E8B84B"/>
  <g stroke="#E8B84B" stroke-width="2.4" stroke-linecap="round">
    <line x1="16" y1="4"    x2="16" y2="7.6"/>
    <line x1="16" y1="24.4" x2="16" y2="28"/>
    <line x1="4"  y1="16"   x2="7.6" y2="16"/>
    <line x1="24.4" y1="16" x2="28" y2="16"/>
    <line x1="7.5"  y1="7.5"  x2="10.1" y2="10.1"/>
    <line x1="21.9" y1="21.9" x2="24.5" y2="24.5"/>
    <line x1="24.5" y1="7.5"  x2="21.9" y2="10.1"/>
    <line x1="10.1" y1="21.9" x2="7.5"  y2="24.5"/>
  </g>
</svg>
