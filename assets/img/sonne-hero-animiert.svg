<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 64">
  <title>Sonne — Hero-Animation, Anki Strahl</title>
  <!-- Eigenständige Kopie der Hero-Sonne aus index.html samt Aufgeh-Animation.
       Auf der Website steuert main.js per Klasse hero.is-ready, wann es
       losgeht. Hier läuft dieselbe Animation beim Öffnen der Datei von
       selbst per CSS, keine Abhängigkeit von main.js nötig.
       Für dunklen Untergrund gedacht (Strich ist Weiß, wie im Hero). -->
  <style>
    path {
      fill: none;
      stroke: #ffffff;
      stroke-opacity: 0.88;
      stroke-linecap: round;
      stroke-width: 0.98;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation-fill-mode: forwards;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes aufgehen { to { stroke-dashoffset: 0; } }
    .sun__horizon path {
      animation-name: aufgehen;
      animation-duration: 1000ms;
      animation-delay: 200ms;
    }
    .sun__rays path {
      animation-name: aufgehen;
      animation-duration: 850ms;
      animation-delay: calc(750ms + var(--d, 0ms));
    }
  </style>
  <g class="sun__rays">
    <path style="--d:0ms"   pathLength="1" d="M60 39V7"/>
    <path style="--d:90ms"  pathLength="1" d="M64.4 39.58 68.28 25.09"/>
    <path style="--d:90ms"  pathLength="1" d="M55.6 39.58 51.72 25.09"/>
    <path style="--d:180ms" pathLength="1" d="M68.5 41.28 83.5 15.3"/>
    <path style="--d:180ms" pathLength="1" d="M51.5 41.28 36.5 15.3"/>
    <path style="--d:270ms" pathLength="1" d="M72.02 43.98 83.33 32.67"/>
    <path style="--d:270ms" pathLength="1" d="M47.98 43.98 36.67 32.67"/>
    <path style="--d:360ms" pathLength="1" d="M74.72 47.5 101.57 32"/>
    <path style="--d:360ms" pathLength="1" d="M45.28 47.5 18.43 32"/>
    <path style="--d:450ms" pathLength="1" d="M76.42 51.6 92.84 47.2"/>
    <path style="--d:450ms" pathLength="1" d="M43.58 51.6 27.16 47.2"/>
    <path style="--d:540ms" pathLength="1" d="M77 56h29"/>
    <path style="--d:540ms" pathLength="1" d="M43 56H14"/>
  </g>
  <g class="sun__horizon">
    <path pathLength="1" d="M78 56h36"/>
    <path pathLength="1" d="M42 56H6"/>
  </g>
</svg>
